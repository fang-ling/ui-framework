<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    @font-face {
      font-family: "UIKit SF Pro";
      src: url("/Resources/Fonts/SF-Pro.ttf") format("truetype");
    }

    :root {
      color-scheme: light dark;

      /* Backgrounds (Light Mode) */
      --background-material-system-chrome: #FFFFFFBF;

      /* Background Blend Modes (Light Mode) */
      --background-blend-mode-material-system-chrome: hard-light;

      /* Colors (Light Mode) */
      --color-accent:               #007AFF;
      --color-label-primary:        #000000;
      --color-system-chrome-shadow: #0000004D;
      --color-tab-unselected:       #999999;
    }

    .view {
      position: absolute;
      box-sizing: border-box;
    }

    body {
      background: white;
      position: relative;
      margin: 0px;
      font-family: "UIKit SF Pro";
      overflow: hidden;
    }

    button {
      padding: 0px;
      border: 0px;
      background-color: transparent;
      font-family: inherit;
    }

    p {
      margin: 0px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* Backgrounds (Dark Mode) */
        --background-material-system-chrome: #1C1C1CE6;

        /* Background Blend Modes (Dark Mode) */
        --background-blend-mode-material-system-chrome: overlay;

        /* Colors (Dark Mode) */
        --color-accent:               #0A84FF;
        --color-label-primary:        #FFFFFF;
        --color-system-chrome-shadow: #FFFFFF26;
        --color-tab-unselected:       #7E7E7E;
      }

      body {
        background: black;
      }
    }
  </style>
</head>

<body>
  <span style="visibility: hidden; display: absolute">
    FONT_LOADING_PLACEHOLDER_DO_NOT_REMOVE
  </span>

  <script type="module">
    import {
      WASI,
      OpenFile,
      File,
      ConsoleStdout
    } from "/Resources/JavaScripts/WASIShims.js"
    import {
      JavaScriptCoreInitialize,
      JavaScriptCoreWindowGetWidth,
      JavaScriptCoreWindowGetHeight,
      JavaScriptCoreMeasureTextSize,
      JavaScriptCoreNodeInitializeButtonNode,
      JavaScriptCoreNodeInitializeDivisionNode,
      JavaScriptCoreNodeInitializeParagraphNode,
      JavaScriptCoreNodeInitializeSpanNode,
      JavaScriptCoreNodeAddClickEventListener,
      JavaScriptCoreNodeAddSubnode,
      JavaScriptCoreNodeInsertSubnodeAtIndex,
      JavaScriptCoreNodeRemoveFromSupernode,
      JavaScriptCoreNodeUpdateClassName,
      JavaScriptCoreNodeUpdateStyleProperty,
      JavaScriptCoreNodeUpdateTextContent
    } from "/Resources/JavaScripts/JavaScriptCoreKit.js"

    const wasi = new WASI(
      [],
      [],
      [
        new OpenFile(new File([])),
        ConsoleStdout.lineBuffered(msg => console.log(`[WASI stdout] ${msg}`)),
        ConsoleStdout.lineBuffered(msg => console.warn(`[WASI stderr] ${msg}`))
      ]
    )

    const memory = new WebAssembly.Memory({
      initial: 587,
      maximum: 16384,
      shared: true
    })
    const { instance } = await WebAssembly.instantiateStreaming(
      fetch("/Examples/ui-kit-example/.build/release/UIKitExample.wasm"),
      {
        wasi_snapshot_preview1: wasi.wasiImport,
        env: {
          memory,
          swift_addNewDSOImage: () => {},
          JavaScriptCoreWindowGetWidth,
          JavaScriptCoreWindowGetHeight,
          JavaScriptCoreMeasureTextSize,
          JavaScriptCoreNodeInitializeButtonNode,
          JavaScriptCoreNodeInitializeDivisionNode,
          JavaScriptCoreNodeInitializeParagraphNode,
          JavaScriptCoreNodeInitializeSpanNode,
          JavaScriptCoreNodeAddClickEventListener,
          JavaScriptCoreNodeAddSubnode,
          JavaScriptCoreNodeInsertSubnodeAtIndex,
          JavaScriptCoreNodeRemoveFromSupernode,
          JavaScriptCoreNodeUpdateClassName,
          JavaScriptCoreNodeUpdateStyleProperty,
          JavaScriptCoreNodeUpdateTextContent
        }
      }
    )
    wasi.initialize(instance)

    JavaScriptCoreInitialize(instance, memory)

    document.fonts.ready.then(() => {
      instance.exports.main()
    })
  </script>
</body>
